<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>ONZ · 나를 위한 한 잔</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="header">
    <button id="nav-back" class="icon-button" aria-label="이전 질문" type="button">←</button>
    <a class="brand" href="/" aria-label="ONZ 처음으로">onz<span>나를 위한 한 잔</span></a>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>
  <main aria-label="칵테일 맞춤 추천">
    <div id="progress-region">
      <div class="step-line"><span id="step-label">취향 찾기 · 맛</span><span id="step-count">1 / 5</span></div>
      <div id="progress" class="progress" role="progressbar" aria-label="질문 진행 단계" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1"><span id="progress-fill"></span></div>
    </div>
    <div id="mode" class="mode" role="status" hidden></div>
    <div id="app"></div>
  </main>
</body>
</html>
